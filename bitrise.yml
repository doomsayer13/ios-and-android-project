---
format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
trigger_map:
- push_branch: "*"
  workflow: primary
- pull_request_source_branch: "*"
  workflow: primary
pipelines:
  noop:
    stages:
    - noop: {}
stages:
  noop:
    workflows:
    - noop: {}
workflows:
  deploy:
    description: |
      The workflow tests, builds and deploys the app using *Deploy to bitrise.io* step.

      For testing the *retry_on_failure* test repetition mode is enabled.

      Next steps:
      - Set up [Connecting to an Apple service with API key](https://devcenter.bitrise.io/en/accounts/connecting-to-services/connecting-to-an-apple-service-with-api-key.html##).
      - Or further customise code signing following our [iOS code signing](https://devcenter.bitrise.io/en/code-signing/ios-code-signing.html) guide.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            # write your script here
            echo "Hello World!"
            echo $TEST_VAR

            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb
    - xcode-test@4:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - test_repetition_mode: retry_on_failure
        - cache_level: none
    - xcode-archive@4:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - distribution_method: "$BITRISE_DISTRIBUTION_METHOD"
        - automatic_code_signing: api-key
        - cache_level: none
    - deploy-to-bitrise-io@2: {}
  noop:
    steps:
    - script@1:
        inputs:
        - content: |-
            set -ex

            exit 1
  primary:
    description: |
      The workflow executes the tests. The *retry_on_failure* test repetition mode is enabled.

      Next steps:
      - Check out [Getting started with iOS apps](https://devcenter.bitrise.io/en/getting-started/getting-started-with-ios-apps.html).
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            #!/usr/bin/env bash
            # fail if any commands fails
            set -e
            # make pipelines' return status equal the last command to exit with a non-zero status, or zero if all commands exit successfully
            set -o pipefail
            # debug log
            set -x

            # write your script here
            echo "Hello World!"
            echo "${TEST_VAR}"

            # or run a script from your repository, like:
            # bash ./path/to/script.sh
            # not just bash, e.g.:
            # ruby ./path/to/script.rb
    - xcode-test@4:
        inputs:
        - project_path: "$BITRISE_PROJECT_PATH"
        - scheme: "$BITRISE_SCHEME"
        - test_repetition_mode: retry_on_failure
        - cache_level: none
    - deploy-to-bitrise-io@2: {}
  successful:
    steps:
    - script:
        title: First script
        inputs:
        - content: |-
            #!/bin/bash

            echo "First"

            for i in {1..1000}
            do
                echo "Time passed: $i tizedseconds"
                sleep .1
            done

            echo "First script success!"
    - script:
        title: Second script
        inputs:
        - content: |-
            #!/bin/bash

            echo "Second"

            for i in {1..100}
            do
                echo "Time passed: $i seconds"
                sleep 1
            done

            echo "Second script success!"
    - script:
        title: Third script
        inputs:
        - content: |-
            #!/bin/bash

            echo "Third"

            for i in {1..1000}
            do
                echo "Time passed: $i tizedseconds"
                sleep .1
            done

            echo "Third script success!"
    - script:
        title: Fourth script
        inputs:
        - content: |-
            #!/bin/bash

            echo "Fourth"

            for i in {1..100}
            do
                echo "Time passed: $i seconds"
                sleep 1
            done

            echo "Fourth script success!"
meta:
  bitrise.io:
    stack: linux-docker-android-20.04 
    machine_type_id: standard
app:
  envs:
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: ios/BitriseXcode7Sample.xcodeproj
  - opts:
      is_expand: false
    BITRISE_SCHEME: BitriseXcode7Sample
  - opts:
      is_expand: false
    BITRISE_DISTRIBUTION_METHOD: development
